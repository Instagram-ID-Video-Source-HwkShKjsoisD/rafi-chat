<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafi</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rafi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8607a">
<style>
:root{--bg:#fff7f5;--card:#fff;--me:#e8607a;--me-t:#fff;--bot:#f3e6e3;--bot-t:#2b2223;--muted:#8a7a7c;--line:#ecd9d5}
@media (prefers-color-scheme:dark){:root{--bg:#1b1415;--card:#251c1e;--me:#d4506b;--bot:#33282a;--bot-t:#f1e6e4;--muted:#a39092;--line:#3a2e30}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--bot-t);display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0}header small{color:var(--muted);display:block;font-size:12px}
header button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.me{align-self:flex-end;background:var(--me);color:var(--me-t);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.typing{color:var(--muted);font-style:italic}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;background:var(--bg);color:inherit;max-height:120px}
form button{border:0;background:var(--me);color:#fff;border-radius:20px;padding:0 18px;font-size:16px;font-weight:600}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="avatar">R</div>
  <div><h1>Rafi</h1><small>AI teman ngobrol</small></div>
  <button id="reset" type="button">Mulai ulang</button>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ketik pesan..." autocomplete="off"></textarea>
  <button id="send" type="submit">Kirim</button>
</form>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const KEY = "rafi_history";
let history = [];
try { history = JSON.parse(localStorage.getItem("rafi_history") || "[]"); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(history.slice(-60))); } catch (e) {} }
function add(role, text, extra) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot") + (extra ? " " + extra : "");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function greet() { add("assistant", "Hai, aku Rafi. Hari kamu gimana?"); }
function render() { chat.innerHTML = ""; if (!history.length) greet(); history.forEach(m => add(m.role, m.content)); }

async function ask() {
  const headers = { "content-type": "application/json" };
  const code = localStorage.getItem("rafi_code");
  if (code) headers["x-access-code"] = code;
  const r = await fetch("/api/chat", { method: "POST", headers, body: JSON.stringify({ messages: history.slice(-30) }) });
  const data = await r.json();
  if (r.status === 401) { localStorage.removeItem("rafi_code"); throw new Error("auth"); }
  if (!r.ok) throw new Error(data.error || "Terjadi kesalahan");
  return data.reply;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "auto";
  history.push({ role: "user", content: text }); save();
  add("user", text);
  send.disabled = true;
  const t = add("assistant", "Rafi sedang mengetik...", "typing");
  try {
    let reply;
    try { reply = await ask(); }
    catch (err) {
      if (err.message !== "auth") throw err;
      const c = prompt("Masukkan kode akses:");
      if (!c) throw new Error("Kode akses diperlukan");
      localStorage.setItem("rafi_code", c);
      reply = await ask();
    }
    t.remove(); history.push({ role: "assistant", content: reply }); save(); add("assistant", reply);
  } catch (err) {
    t.textContent = "Maaf, ada masalah: " + err.message; t.classList.remove("typing");
    history.pop(); save();
  } finally { send.disabled = false; input.focus(); }
});

input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.getElementById("reset").addEventListener("click", () => { if (confirm("Mulai percakapan dari awal?")) { history = []; save(); render(); } });
render();
</script>
</body>
</html>
